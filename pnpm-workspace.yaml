packages:
  - packages/bluesky/*
  - packages/clients/*
  - packages/definitions/*
  - packages/identity/*
  - packages/internal/*
  - packages/lexicons/*
  - packages/misc/*
  - packages/oauth/*
  - packages/servers/*
  - packages/utilities/*

allowBuilds:
  better-sqlite3: true
  cbor-extract: true
  core-js: false
  esbuild: true
  sharp: true

minimumReleaseAgeExclude:
  - '@oomfware/*'

patchedDependencies:
  '@atproto/pds@0.5.17': patches/@atproto__pds@0.5.17.patch
